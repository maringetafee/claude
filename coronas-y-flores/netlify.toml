# Monorepo: en Netlify, Base directory = coronas-y-flores
[build]
  command = "npm run build"
  publish = ".next"
  # Solo compila si ha cambiado esta carpeta (el repo tiene más proyectos)
  ignore = "git diff --quiet $CACHED_COMMIT_REF $COMMIT_REF -- ."

[build.environment]
  NODE_VERSION = "22"

# Motor de Next.js en Netlify (SSR, API routes, proxy). Sin él se publica
# .next como estáticos y todo da 404.
[[plugins]]
  package = "@netlify/plugin-nextjs"
