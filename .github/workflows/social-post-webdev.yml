name: Publicar en Instagram y Facebook (agencia web)

on:
  schedule:
    # Lunes, miercoles y viernes a las 15:00 UTC (17:00 hora de España en verano)
    - cron: "0 15 * * 1,3,5"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Simular sin publicar de verdad"
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Publicar siguiente contenido
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          FB_PAGE_ID: ${{ secrets.FB_PAGE_ID }}
          FB_PAGE_ACCESS_TOKEN: ${{ secrets.FB_PAGE_ACCESS_TOKEN }}
          BUSINESS_NICHE: ${{ vars.BUSINESS_NICHE }}
          DRY_RUN: ${{ github.event.inputs.dry_run }}
        run: python social-automation/scripts/run.py

      - name: Commit y push de cambios (posted.json y archivos movidos)
        run: |
          git config user.name "Mario"
          git config user.email "pericoeldelospalotes681@gmail.com"
          git add social-automation/content
          if ! git diff --cached --quiet; then
            git commit -m "Auto: publicacion social (${{ github.run_id }})"
            git push
          else
            echo "Sin cambios que commitear."
          fi
